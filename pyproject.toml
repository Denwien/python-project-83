[tool.poetry]
name = "hexlet-code"
version = "0.1.0"
description = "Python Project 83"
authors = ["Denwien"]
readme = "README.md"
packages = [{include = "page_analyzer"}]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.1.0"
gunicorn = "^23.0.0"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.10"
validators = "^0.34.0"
requests = "^2.32.3"
beautifulsoup4 = "^4.12.0"
lxml = "^5.3.1"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.0.350"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
